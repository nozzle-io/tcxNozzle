name: CI

on:
  workflow_dispatch:
    inputs:
      trusscli_prebuilt:
        description: 'trusscli prebuilt mode passed to trussc-actions (auto/off/strict)'
        type: choice
        default: auto
        options:
          - 'auto'
          - 'off'
          - 'strict'
      cache_key_suffix:
        description: 'trusscli cache key suffix; set a unique value to force fallback cold-build validation'
        type: string
        default: 'v3'
      linux_ccache:
        description: 'Linux ccache mode passed to trussc-actions (auto/off)'
        type: choice
        default: auto
        options:
          - 'auto'
          - 'off'
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve the asset-upload / latest-tag publication sequence on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' && github.event_name != 'release' }}

jobs:
  build:
    uses: 2bbb/trussc-actions/.github/workflows/build-addon.yml@404cc610f124be55d68aef31f780b63c1f847b7e
    with:
      addon_name: "tcxNozzle"
      test_app: "testApp"
      test_mode: "build-only"
      extra_apt_packages: "libdrm-dev libgbm-dev libegl-dev libgl-dev"
      trussc_ref: "v0.6.0"
      trusscli_prebuilt: ${{ github.event.inputs.trusscli_prebuilt || 'auto' }}
      cache_key_suffix: ${{ github.event.inputs.cache_key_suffix || 'v3' }}
      linux_ccache: ${{ github.event.inputs.linux_ccache || 'auto' }}
      trusscli_prebuilt_tag: "trusscli-v0.6.0-build-addon-prebuilt-v1"

  package:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare package metadata
        id: meta
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            base="${repo}-${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            base="${repo}-latest-${short_sha}"
          elif [[ "${GITHUB_REF}" == refs/heads/stable ]]; then
            base="${repo}-stable-${short_sha}"
          else
            base="${repo}-ci-${short_sha}"
          fi
          echo "package_root=${base}" >> "$GITHUB_OUTPUT"
          echo "package_name=${base}.zip" >> "$GITHUB_OUTPUT"

      - name: Assemble source addon package
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          mkdir -p "$root"
          cp README.md LICENSE CMakeLists.txt "$root/"
          cp -R src nozzle testApp "$root/"
          find "$root" \( -name .git -o -name build -o -name .cache -o -name CMakeFiles \) -prune -exec rm -rf {} +
          find "$root" -name '*.o' -delete

      - name: Verify package contents
        run: |
          root="dist/${{ steps.meta.outputs.package_root }}"
          test -f "$root/README.md"
          test -f "$root/LICENSE"
          test -f "$root/src/tcxNozzle.h"
          test -f "$root/nozzle/include/nozzle/nozzle.hpp"

      - name: Create archive
        run: |
          cd dist
          zip -r "${{ steps.meta.outputs.package_name }}" "${{ steps.meta.outputs.package_root }}/"

      - name: Verify archive
        run: |
          archive="dist/${{ steps.meta.outputs.package_name }}"
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/src/tcxNozzle.h'
          unzip -l "$archive" | grep -F '${{ steps.meta.outputs.package_root }}/nozzle/include/nozzle/nozzle.hpp'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.package_root }}
          path: dist/${{ steps.meta.outputs.package_name }}

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="${{ steps.meta.outputs.package_name }}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > existing-assets.txt 2>/dev/null; then
            if grep -Fx "$asset" existing-assets.txt; then
              echo "versioned release asset already exists: $asset" >&2
              exit 1
            fi
          else
            echo "No existing release for ${GITHUB_REF_NAME}; upload may create it."
          fi

      - name: Check latest publication freshness
        id: latest_guard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "skipped: $GITHUB_SHA is no longer main; no release mutation"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete old latest release assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.latest_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' > latest-assets.txt 2>/dev/null; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset latest "$asset" --yes --repo "${GITHUB_REPOSITORY}"
            done < latest-assets.txt
          else
            echo "No existing latest release assets to delete"
          fi

      - name: Upload latest development snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.latest_guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest development snapshot
          prerelease: true
          body: |
            Development snapshot from main.
            Commit: ${{ github.sha }}
          files: dist/${{ steps.meta.outputs.package_name }}

      - name: Verify published assets and move latest tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.latest_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          packages=("dist/${{ steps.meta.outputs.package_name }}")
          test "${#packages[@]}" -gt 0
          previous_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" --jq .object.sha)
          [[ "$previous_ref" =~ ^[0-9a-f]{40}$ ]]
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release view latest --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$verify_dir/notes"
          grep -F "Commit: ${GITHUB_SHA}" "$verify_dir/notes"
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$verify_dir/remote-names"
          for package in "${packages[@]}"; do
            basename "$package"
          done > "$verify_dir/local-names"
          LC_ALL=C sort "$verify_dir/local-names" > "$verify_dir/expected"
          LC_ALL=C sort "$verify_dir/remote-names" > "$verify_dir/actual"
          cmp "$verify_dir/expected" "$verify_dir/actual"
          for package in "${packages[@]}"; do
            asset=$(basename "$package")
            gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$verify_dir"
            cmp "$package" "$verify_dir/$asset"
            echo "verified uploaded bytes: $asset"
          done
          git push origin "--force-with-lease=refs/tags/latest:${previous_ref}" "${GITHUB_SHA}:refs/tags/latest"
          published=$(gh api "repos/${GITHUB_REPOSITORY}/commits/latest" --jq .sha)
          test "$published" = "$GITHUB_SHA"
          echo "verified latest tag commit=$published"

      - name: Upload versioned release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.package_name }}
